name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-audit:
    name: Format, Clippy, Catalog & Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy with strict zero-panic lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Validate OpenFX catalog descriptors
        run: cargo run -p bulldog_packager -- validate-catalog
      - name: Audit dependency SPDX licenses
        run: cargo run -p bulldog_packager -- check-licenses

  test-and-package:
    name: Test & Package (${{ matrix.os }})
    needs: lint-and-audit
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run full workspace test suite
        run: cargo test --workspace
      - name: Build release suite binaries
        run: cargo build --workspace --release
      - name: Package and verify OpenFX bundles
        run: cargo run --release -p bulldog_packager -- package --profile release --out-dir dist
